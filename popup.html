<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoHangout</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛋️ AutoHangout</h1>
      <p class="subtitle">躺平浏览模式</p>
    </header>

    <div class="status-section">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">已停止</span>
      </div>
    </div>

    <button class="toggle-btn" id="toggleBtn">
      <span class="btn-icon" id="btnIcon">▶</span>
      <span class="btn-text" id="btnText">开始浏览</span>
    </button>

    <div class="settings-section">
      <h2>⚙️ 设置</h2>
      
      <div class="setting-item">
        <label for="scrollSpeed">滚动速度 (越小越慢)</label>
        <div class="setting-control">
          <input type="range" id="scrollSpeed" min="1" max="10" value="3">
          <span id="scrollSpeedValue">3</span>
        </div>
      </div>

      <div class="setting-item">
        <label for="readMode">阅读模式</label>
        <div class="setting-control">
          <select id="readMode">
            <option value="random">随机刷帖</option>
            <option value="currentTopic">当前帖子读完</option>
          </select>
        </div>
      </div>

      <div class="setting-item" id="currentTopicAfterFinishGroup" hidden>
        <label for="currentTopicAfterFinish">当前帖子读完后</label>
        <div class="setting-control">
          <select id="currentTopicAfterFinish">
            <option value="continueRandom">返回首页继续随机阅读</option>
            <option value="stop">直接停止</option>
          </select>
        </div>
      </div>
    </div>

    <div class="info-section">
      <h3>📖 阅读规则</h3>
      <ul>
        <li>随机模式会从帖子列表随机选帖并循环阅读</li>
        <li>当前帖子模式会优先把当前主题帖读完</li>
      </ul>
    </div>

    <footer>
      <p class="hint">💡 浏览器最小化时也会继续运行</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
